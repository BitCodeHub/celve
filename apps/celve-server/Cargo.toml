[package]
name = "celve-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Celve Web server: serves the browser app and runs Sage for each open tab"

[lints]
workspace = true

[dependencies]
celve-sage = { workspace = true }
gridcraft-engine = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs"] }
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
jsonwebtoken = "9"
ureq = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
